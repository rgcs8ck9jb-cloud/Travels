<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F4C5C">
<meta name="apple-mobile-web-app-title" content="RafikTrip">
<title>RafikTrip — Tashkent Food</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%230F4C5C%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%225.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2050V16h11a9.6%209.6%200%200%201%200%2019.2H20%22%2F%3E%3Cpath%20d%3D%22M32.6%2035.2%2044.5%2050%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M31.5%2019.6a5.1%205.1%200%200%201%205.1%205.1c0%203.6-5.1%208.6-5.1%208.6s-5.1-5-5.1-8.6a5.1%205.1%200%200%201%205.1-5.1z%22%20fill%3D%22%23FF7A59%22%2F%3E%3Ccircle%20cx%3D%2231.5%22%20cy%3D%2224.7%22%20r%3D%221.9%22%20fill%3D%22%230F4C5C%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== RafikTrip brand tokens ===== */
:root{
  --teal:#0F4C5C; --teal-d:#0A3947; --teal-x:#072B36;
  --teal-l:#E4EEF1; --teal-l2:#F2F7F9;
  --coral:#FF7A59; --coral-d:#BF4526; --coral-l:#FFEFE9;
  --ink:#12262E; --ink2:#5A6E77; --ink3:#8DA0A8; --ink4:#B6C4CA;
  --line:#DFE7EA; --line2:#EDF2F4;
  --bg:#FFFFFF; --surf:#F5F7F8;
  --r:16px; --r2:12px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:"Manrope","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);overscroll-behavior-y:none}
h1,h2,h3,h4,h5{margin:0;font-weight:800;line-height:1.25;letter-spacing:-.02em}
p{margin:0}
a{color:var(--teal)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
b,strong{font-weight:700}

/* ===== brand mark ===== */
.mk{display:block;width:100%;height:100%}
.lockup{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.lockup .mkbox{flex:0 0 auto;display:block;height:42px;aspect-ratio:32/42}
.lockup .wm{font:800 20px/1 var(--font);letter-spacing:-.03em;color:#fff}
.lockup .wm i{font-style:normal;color:var(--coral)}
.lockup.big .mkbox{height:58px}
.lockup.big .wm{font-size:30px}

/* ===== header ===== */
header{position:sticky;top:0;z-index:900;background:var(--teal);color:#fff}
.crumb{display:flex;align-items:center;gap:7px;padding:calc(var(--st) + 9px) 12px 0;overflow-x:auto;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb a,.crumb button{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.14);border:0;border-radius:100px;padding:8px 13px;cursor:pointer;
  font:700 12.5px/1 var(--font);white-space:nowrap;
}
.crumb a:active,.crumb button:active{background:rgba(255,255,255,.3)}
.crumb .sp{flex:1 0 8px}
.crumb .accent{background:var(--coral);color:#fff}
.hb{display:flex;align-items:center;gap:12px;padding:12px 14px 13px}
.hb .mkbox{flex:0 0 auto;display:block;height:31px;aspect-ratio:32/42;align-self:center}
.hb .tt{min-width:0}
.hb h1{font-size:21px}
.hb .sub{display:block;font-size:12px;opacity:.85;font-weight:700;margin-top:2px}
nav{display:flex;padding:0 8px;background:var(--teal)}
nav button{
  flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
  color:rgba(255,255,255,.7);font:700 13.5px/1 var(--font);
  padding:12px 8px 11px;border-bottom:3px solid transparent;
}
nav button.on{color:#fff;border-bottom-color:var(--coral)}

main{padding-bottom:calc(var(--sb) + 40px)}
.pane{display:none}
.pane.on{display:block}
.wrap{padding:0 14px;max-width:760px;margin:0 auto}

/* ===== shared ===== */
.hero{background:linear-gradient(150deg,var(--teal),var(--teal-x));color:#fff;border-radius:var(--r);padding:18px;margin:14px 0}
.hero h2{font-size:19px;margin-bottom:8px}
.hero p{font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.88);margin-bottom:9px}
.hero p:last-of-type{margin-bottom:0}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.pills span{background:rgba(255,255,255,.16);border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:700}
.sech{display:flex;align-items:center;gap:11px;margin:24px 0 11px}
.sech h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.sech i{flex:1;height:1px;background:var(--line);font-style:normal}
.chev{
  flex:0 0 23px;height:23px;border-radius:50%;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
  font:700 12px/1 var(--font);transition:transform .18s ease;
}
details[open]>summary .chev{transform:rotate(180deg)}

/* ===== plan ===== */
.daygrp{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:#fff}
.daygrp>summary{display:flex;align-items:center;gap:11px;padding:15px}
.daygrp>summary .dl{flex:1;min-width:0}
.daygrp>summary h3{font-size:17px;color:var(--teal)}
.daygrp>summary .ds{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:2px}
.daygrp[open]>summary{background:var(--teal-l2);border-bottom:1px solid var(--line)}
.blocks{padding:4px 10px 10px}
.block{border:1px solid var(--line);border-radius:var(--r2);margin-top:9px;overflow:hidden}
.block>summary{display:flex;align-items:center;gap:10px;padding:13px}
.block>summary .slot{
  flex:0 0 auto;background:var(--teal);color:#fff;font:800 9.5px/1 var(--font);
  letter-spacing:.08em;text-transform:uppercase;border-radius:100px;padding:6px 9px;
}
.block>summary .slot.eve{background:var(--coral)}
.block>summary .bt{flex:1;min-width:0;font-size:14.5px;font-weight:700}
.block>summary .bh{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:3px}
.bbody{padding:2px 13px 14px;border-top:1px solid var(--line2)}
.bbody>p{font-size:14.5px;line-height:1.65;color:var(--ink2);margin:11px 0 13px}

.seq{list-style:none;margin:0 0 13px;padding:0}
.seq li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.seq li:last-child{border-bottom:0}
.seq .n{flex:0 0 25px;height:25px;border-radius:50%;background:var(--teal-l);color:var(--teal);display:flex;align-items:center;justify-content:center;font:800 11.5px/1 var(--font);margin-top:2px}
.seq .n.h{background:var(--ink);color:#fff}
.seq .n.o{background:var(--surf);color:var(--ink3)}
.seq .t{flex:1;min-width:0}
.seq .t b{display:block;font-size:14.5px;font-weight:700}
.seq .t i{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:1px}
.seq .go{appearance:none;border:0;background:var(--surf);color:var(--teal);font:700 11.5px/1 var(--font);padding:8px 10px;border-radius:8px;cursor:pointer;margin-top:2px}
.seq li.done .t b{color:var(--ink3);text-decoration:line-through}
.seq li.done .t i{display:none}
.seq li.done .n{background:var(--teal);color:#fff}

.tick{
  flex:0 0 24px;width:24px;height:24px;margin-top:2px;border-radius:7px;
  border:2px solid var(--line);background:#fff;cursor:pointer;appearance:none;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.tick::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tick[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.tick[aria-pressed="true"]::after{opacity:1}

.btn{display:block;width:100%;text-align:center;text-decoration:none;cursor:pointer;appearance:none;border:0;background:var(--teal);color:#fff;font:700 14px/1 var(--font);padding:14px;border-radius:var(--r2);margin-bottom:8px}
.btn.g{background:var(--surf);color:var(--teal);border:1px solid var(--line)}
.btn.coral{background:var(--coral)}
.tipbox{background:var(--coral-l);border-radius:var(--r2);padding:13px 15px;margin-top:12px}
.tipbox ul{margin:0;padding-left:17px}
.tipbox li{font-size:13.5px;line-height:1.55;margin-bottom:6px;color:#7a3a22}
.tipbox li:last-child{margin-bottom:0}

.jump{display:flex;gap:10px;margin:16px 0 6px}
.jump a{flex:1;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;background:#fff}
.jump a:active{background:var(--surf)}
.jump b{display:block;font-size:15.5px}
.jump span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.jump em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--coral-d);margin-top:9px}

/* ===== map ===== */
.gbar{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.gbar::-webkit-scrollbar{display:none}
.gbar a{flex:0 0 auto;text-decoration:none;background:var(--teal);color:#fff;font:700 12.5px/1 var(--font);padding:11px 14px;border-radius:100px;white-space:nowrap}
.gbar a.alt{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.hint{padding:11px 14px;background:var(--teal-l2);color:var(--teal-d);font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.seg{display:flex;padding:11px 14px}
.seg button{flex:1;appearance:none;cursor:pointer;background:var(--surf);color:var(--ink2);border:1px solid var(--line);font:700 13px/1 var(--font);padding:11px 6px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#map{width:100%;height:calc(100vh - 300px - var(--st));height:calc(100dvh - 300px - var(--st));min-height:360px;background:var(--surf)}
.pin{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font:800 12.5px/1 var(--font);box-shadow:0 2px 8px rgba(18,38,46,.35)}
.pin.x{background:var(--coral)}
.pin.h{background:var(--ink);border-radius:8px}
.leaflet-popup-content-wrapper{border-radius:13px}
.leaflet-popup-content{margin:12px 13px;font:14px/1.45 var(--font)}
.pop b{display:block;font-size:15px;margin-bottom:2px}
.pop i{display:block;font-style:normal;color:var(--ink2);font-size:12px;margin-bottom:9px}
.pop .r{display:flex;gap:6px}
.pop a{flex:1;text-align:center;text-decoration:none;font:700 12.5px/1 var(--font);padding:9px 8px;border-radius:8px}
.pop a.p{background:var(--teal);color:#fff}
.pop a.s{background:var(--coral-l);color:var(--coral-d)}
#plan{display:none;background:var(--surf)}
#plan.on{display:block}
#planSvg{width:100%;height:auto;display:block}
.pfoot{padding:10px 14px 16px;font-size:12px;color:var(--ink2);text-align:center}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:950;background:#fff;border-radius:var(--r);box-shadow:0 10px 40px rgba(18,38,46,.25);border:1px solid var(--line);padding:15px;display:none}
.sheet.on{display:block}
.sheet b{display:block;font-size:16px;margin-bottom:2px}
.sheet i{display:block;font-style:normal;color:var(--ink2);font-size:12.5px;margin-bottom:11px}
.sheet .r{display:flex;gap:7px}
.sheet .r a,.sheet .r button{flex:1;appearance:none;border:0;cursor:pointer;text-align:center;text-decoration:none;font:700 13px/1 var(--font);padding:12px 6px;border-radius:10px}
.sheet .r a.p{background:var(--teal);color:#fff}
.sheet .r a.s{background:var(--coral-l);color:var(--coral-d)}
.sheet .r button{background:var(--surf);color:var(--ink2);border:1px solid var(--line)}

/* ===== stops ===== */
.prog{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:14px 0 6px}
.prog .pt{flex:1}
.prog .pt b{display:block;font-size:15px}
.prog .bar{height:6px;border-radius:100px;background:var(--line2);margin-top:8px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--coral);border-radius:100px;transition:width .25s ease}
.prog button{appearance:none;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font:700 12px/1 var(--font);padding:9px 12px;border-radius:9px;cursor:pointer}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;scroll-margin-top:150px}
.card.flash{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-l)}
.chead{display:flex;gap:11px;padding:15px 14px 12px;align-items:flex-start}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--font)}
.card.extra .num{background:var(--coral)}
.chead .ct{flex:1;min-width:0}
.chead h3{font-size:16.5px}
.chead .alt{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px;line-height:1.45;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 13px}
.meta span{font-size:11px;font-weight:700;background:var(--surf);color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.meta span.t{background:var(--teal-l);color:var(--teal);border-color:#cfe1e6}
.acts{display:flex;gap:8px;padding:0 14px 13px}
.acts a,.acts button{flex:1;appearance:none;border:0;cursor:pointer;text-align:center;text-decoration:none;font:700 13px/1 var(--font);padding:12px 6px;border-radius:10px}
.acts a{background:var(--teal);color:#fff}
.acts button{background:var(--surf);color:var(--ink2);border:1px solid var(--line)}
.sec{border-top:1px solid var(--line);padding:14px}
.sec h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-d);margin-bottom:9px}
.sec ul{margin:0;padding-left:17px}
.sec li{margin-bottom:7px;font-size:14.5px;line-height:1.55}
.sec li:last-child{margin-bottom:0}
.card details{border-top:1px solid var(--line)}
.card details>summary{padding:14px;display:flex;justify-content:space-between;align-items:center;font:700 13.5px/1 var(--font);color:var(--teal);background:var(--teal-l2)}
.card details>summary::after{content:"+";font-size:19px;font-weight:400;line-height:1}
.card details[open]>summary::after{content:"–"}
.body{padding:6px 15px 20px}
.body p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:#1c333c}
.body p:last-child{margin:0}
.body h4{font-size:15.5px;color:var(--teal);margin:19px 0 8px;text-transform:none;letter-spacing:-.01em}
.body em{color:var(--ink2)}

.card.done{background:var(--surf);border-color:var(--line2)}
.card.done .chead{padding:11px 14px;align-items:center}
.card.done .num{flex:0 0 24px;height:24px;font-size:11.5px;background:var(--teal-l);color:var(--teal)}
.card.done h3{font-size:14.5px;color:var(--ink3);text-decoration:line-through}
.card.done .alt,.card.done .meta,.card.done .acts,.card.done .sec,.card.done details{display:none}

/* ===== sub pages ===== */
.sub{padding:0 14px calc(var(--sb) + 30px);max-width:760px;margin:0 auto}
.dish{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.dish:last-child{border-bottom:0}
.dish .dn{flex:0 0 100px;font-weight:700;font-size:14.5px;color:var(--teal)}
.dish .dd{flex:1;font-size:14px;line-height:1.55;color:var(--ink2)}
.eat{border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:10px}
.eat .et{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.eat h4{font-size:16px}
.eat .pr{font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
.eat .ea{font-size:12px;color:var(--coral-d);font-weight:700;margin-top:3px}
.eat p{font-size:14px;line-height:1.6;color:var(--ink2);margin-top:8px}
.eat a{display:inline-block;margin-top:11px;text-decoration:none;background:var(--surf);border:1px solid var(--line);color:var(--teal);font:700 12.5px/1 var(--font);padding:10px 13px;border-radius:9px}
.pc{border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.pc>summary{display:flex;align-items:center;gap:11px;padding:15px;background:var(--teal-l2)}
.pc>summary h3{flex:1;font-size:15.5px;color:var(--teal)}
.pc.warn>summary{background:var(--coral-l)}
.pc.warn>summary h3{color:var(--coral-d)}
.pc .pb{padding:13px 16px 17px;border-top:1px solid var(--line2)}
.pc ul{margin:0;padding-left:17px}
.pc li{margin-bottom:8px;font-size:14.5px;line-height:1.55}
.pc li:last-child{margin-bottom:0}
.pc.warn li{color:#7a3a22}
.backbar{margin:20px 0 4px}

footer{padding:22px 16px calc(var(--sb) + 28px);text-align:center;color:var(--ink3);font-size:12px;line-height:1.6}
footer .fmark{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px;text-decoration:none}
footer .fmark .mkbox{display:block;width:24px;height:24px}
footer .fmark b{font:800 14px/1 var(--font);color:var(--teal);letter-spacing:-.02em}
footer .fmark b i{font-style:normal;color:var(--coral)}
#top{position:fixed;right:14px;bottom:calc(var(--sb) + 16px);z-index:800;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:19px;box-shadow:0 4px 14px rgba(18,38,46,.3);display:none;cursor:pointer}

</style>
</head>
<body>

<header>
  <div class="crumb">
    <button id="back">&#8592; Back</button>
    <a href="tashkent.html">Tashkent</a>
    <span class="sp"></span>
    <a href="tashkent-info.html" class="accent">Practical</a>
    <a href="index.html">Home</a>
  </div>
  <div class="hb">
    <a class="mkbox" href="index.html" aria-label="RafikTrip home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="16 12 32 42" class="mk"><g fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 50V16h11a9.6 9.6 0 0 1 0 19.2H20"/><path d="M32.6 35.2 44.5 50"/></g><path d="M31.5 19.6a5.1 5.1 0 0 1 5.1 5.1c0 3.6-5.1 8.6-5.1 8.6s-5.1-5-5.1-8.6a5.1 5.1 0 0 1 5.1-5.1z" fill="#FF7A59"/><circle cx="31.5" cy="24.7" r="1.9" fill="#0F4C5C"/></svg></a>
    <div class="tt"><h1>Food</h1><span class="sub">Tashkent</span></div>
  </div>
</header>

<h4>The Monument of Courage</h4>
<p>A short walk away, and the thing actually worth seeing. At 05:23 on <strong>26 April 1966</strong>, an earthquake struck directly beneath central Tashkent. The magnitude was moderate — around 5.2 — but the focus was shallow and the city was built of unreinforced mud brick. Some 300,000 people lost their homes. The official death toll was low and is widely doubted.</p>
<p>The monument marks the epicentre. A cube of black granite is split by a jagged crack, with the date and time carved on it; a bronze woman and man shield a child, the man's arm thrown out against the fault. Behind them a relief shows the reconstruction, which was carried out by work brigades sent from every Soviet republic and which rebuilt Tashkent in three years as a modern city of wide avenues and prefabricated blocks. That is why the capital of Uzbekistan looks the way it does, and why so little of the old city survives — the earthquake is the single most important fact about the shape of modern Tashkent.</p>`

<p>The house was nationalised after the revolution and became a museum of applied arts in 1937. The collection now runs to several thousand pieces: suzani embroidery from every region, each with its own vocabulary of motifs; ceramics from Rishtan in that particular unrepeatable blue; skullcaps, jewellery, carved doors, copperware, silk ikat.</p>
<p><strong>Why it beats the bigger museums.</strong> The State History Museum has been closed for renovation since 2024. The Amir Timur Museum is mostly interpretation. This is the one place in Tashkent where you can look closely at the actual objects — and at a complete interior — after a week of looking at buildings from thirty metres away. If your family has enjoyed the tilework and the woodwork on this trip, this is where they find out how it was made.</p>`

<p>It is where Tashkent families go at weekends, which means it is busy on Saturday and Sunday and comparatively empty midweek. There are yurt camps and roadside cafés doing shashlik, a via ferrata and zip line at Amirsoy, and easy walking rather than serious hiking if you have a child.</p>
<p>Hire a car and driver for the day through your hotel rather than a tour — it costs less, you set your own pace, and you can stop wherever the view is good. Take swimming things for the lake.</p>`

  hours:"Best after 19:00",
  more:`<p>A large new landscaped park in the middle of the redeveloped Tashkent City district, with lawns, water channels, a big musical fountain that runs in the evening, and a lot of families out after dark.</p>
<p>Nearby, <strong>Magic City</strong> is an unabashedly kitsch theme park of miniature European castles, illuminated at night, with rides, restaurants and a light show. It has no cultural value whatsoever and small children find it wonderful.</p>
