<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F4C5C">
<meta name="apple-mobile-web-app-title" content="RafikTrip">
<title>RafikTrip — Bukhara Practical</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%230F4C5C%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%225.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2050V16h11a9.6%209.6%200%200%201%200%2019.2H20%22%2F%3E%3Cpath%20d%3D%22M32.6%2035.2%2044.5%2050%22%2F%3E%3C%2Fg%3E%3Cpath%20d%3D%22M31.5%2019.6a5.1%205.1%200%200%201%205.1%205.1c0%203.6-5.1%208.6-5.1%208.6s-5.1-5-5.1-8.6a5.1%205.1%200%200%201%205.1-5.1z%22%20fill%3D%22%23FF7A59%22%2F%3E%3Ccircle%20cx%3D%2231.5%22%20cy%3D%2224.7%22%20r%3D%221.9%22%20fill%3D%22%230F4C5C%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== RafikTrip brand tokens ===== */
:root{
  --teal:#0F4C5C; --teal-d:#0A3947; --teal-x:#072B36;
  --teal-l:#E4EEF1; --teal-l2:#F2F7F9;
  --coral:#FF7A59; --coral-d:#BF4526; --coral-l:#FFEFE9;
  --ink:#12262E; --ink2:#5A6E77; --ink3:#8DA0A8; --ink4:#B6C4CA;
  --line:#DFE7EA; --line2:#EDF2F4;
  --bg:#FFFFFF; --surf:#F5F7F8;
  --r:16px; --r2:12px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:"Manrope","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);overscroll-behavior-y:none}
h1,h2,h3,h4,h5{margin:0;font-weight:800;line-height:1.25;letter-spacing:-.02em}
p{margin:0}
a{color:var(--teal)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
b,strong{font-weight:700}

/* ===== brand mark ===== */
.mk{display:block;width:100%;height:100%}
.lockup{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.lockup .mkbox{flex:0 0 auto;display:block;height:42px;aspect-ratio:32/42}
.lockup .wm{font:800 20px/1 var(--font);letter-spacing:-.03em;color:#fff}
.lockup .wm i{font-style:normal;color:var(--coral)}
.lockup.big .mkbox{height:58px}
.lockup.big .wm{font-size:30px}

/* ===== header ===== */
header{position:sticky;top:0;z-index:900;background:var(--teal);color:#fff}
.crumb{display:flex;align-items:center;gap:7px;padding:calc(var(--st) + 9px) 12px 0;overflow-x:auto;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb a,.crumb button{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.14);border:0;border-radius:100px;padding:8px 13px;cursor:pointer;
  font:700 12.5px/1 var(--font);white-space:nowrap;
}
.crumb a:active,.crumb button:active{background:rgba(255,255,255,.3)}
.crumb .sp{flex:1 0 8px}
.crumb .accent{background:var(--coral);color:#fff}
.hb{display:flex;align-items:center;gap:12px;padding:12px 14px 13px}
.hb .mkbox{flex:0 0 auto;display:block;height:31px;aspect-ratio:32/42;align-self:center}
.hb .tt{min-width:0}
.hb h1{font-size:21px}
.hb .sub{display:block;font-size:12px;opacity:.85;font-weight:700;margin-top:2px}
nav{display:flex;padding:0 8px;background:var(--teal)}
nav button{
  flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
  color:rgba(255,255,255,.7);font:700 13.5px/1 var(--font);
  padding:12px 8px 11px;border-bottom:3px solid transparent;
}
nav button.on{color:#fff;border-bottom-color:var(--coral)}

main{padding-bottom:calc(var(--sb) + 40px)}
.pane{display:none}
.pane.on{display:block}
.wrap{padding:0 14px;max-width:760px;margin:0 auto}

/* ===== shared ===== */
.hero{background:linear-gradient(150deg,var(--teal),var(--teal-x));color:#fff;border-radius:var(--r);padding:18px;margin:14px 0}
.hero h2{font-size:19px;margin-bottom:8px}
.hero p{font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.88);margin-bottom:9px}
.hero p:last-of-type{margin-bottom:0}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.pills span{background:rgba(255,255,255,.16);border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:700}
.sech{display:flex;align-items:center;gap:11px;margin:24px 0 11px}
.sech h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.sech i{flex:1;height:1px;background:var(--line);font-style:normal}
.chev{
  flex:0 0 23px;height:23px;border-radius:50%;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
  font:700 12px/1 var(--font);transition:transform .18s ease;
}
details[open]>summary .chev{transform:rotate(180deg)}

/* ===== plan ===== */
.daygrp{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:#fff}
.daygrp>summary{display:flex;align-items:center;gap:11px;padding:15px}
.daygrp>summary .dl{flex:1;min-width:0}
.daygrp>summary h3{font-size:17px;color:var(--teal)}
.daygrp>summary .ds{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:2px}
.daygrp[open]>summary{background:var(--teal-l2);border-bottom:1px solid var(--line)}
.blocks{padding:4px 10px 10px}
.block{border:1px solid var(--line);border-radius:var(--r2);margin-top:9px;overflow:hidden}
.block>summary{display:flex;align-items:center;gap:10px;padding:13px}
.block>summary .slot{
  flex:0 0 auto;background:var(--teal);color:#fff;font:800 9.5px/1 var(--font);
  letter-spacing:.08em;text-transform:uppercase;border-radius:100px;padding:6px 9px;
}
.block>summary .slot.eve{background:var(--coral)}
.block>summary .bt{flex:1;min-width:0;font-size:14.5px;font-weight:700}
.block>summary .bh{display:block;font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:3px}
.bbody{padding:2px 13px 14px;border-top:1px solid var(--line2)}
.bbody>p{font-size:14.5px;line-height:1.65;color:var(--ink2);margin:11px 0 13px}

.seq{list-style:none;margin:0 0 13px;padding:0}
.seq li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.seq li:last-child{border-bottom:0}
.seq .n{flex:0 0 25px;height:25px;border-radius:50%;background:var(--teal-l);color:var(--teal);display:flex;align-items:center;justify-content:center;font:800 11.5px/1 var(--font);margin-top:2px}
.seq .n.h{background:var(--ink);color:#fff}
.seq .n.o{background:var(--surf);color:var(--ink3)}
.seq .t{flex:1;min-width:0}
.seq .t b{display:block;font-size:14.5px;font-weight:700}
.seq .t i{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:1px}
.seq .go{appearance:none;border:0;background:var(--surf);color:var(--teal);font:700 11.5px/1 var(--font);padding:8px 10px;border-radius:8px;cursor:pointer;margin-top:2px}
.seq li.done .t b{color:var(--ink3);text-decoration:line-through}
.seq li.done .t i{display:none}
.seq li.done .n{background:var(--teal);color:#fff}

.tick{
  flex:0 0 24px;width:24px;height:24px;margin-top:2px;border-radius:7px;
  border:2px solid var(--line);background:#fff;cursor:pointer;appearance:none;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.tick::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tick[aria-pressed="true"]{background:var(--teal);border-color:var(--teal)}
.tick[aria-pressed="true"]::after{opacity:1}

.btn{display:block;width:100%;text-align:center;text-decoration:none;cursor:pointer;appearance:none;border:0;background:var(--teal);color:#fff;font:700 14px/1 var(--font);padding:14px;border-radius:var(--r2);margin-bottom:8px}
.btn.g{background:var(--surf);color:var(--teal);border:1px solid var(--line)}
.btn.coral{background:var(--coral)}
.tipbox{background:var(--coral-l);border-radius:var(--r2);padding:13px 15px;margin-top:12px}
.tipbox ul{margin:0;padding-left:17px}
.tipbox li{font-size:13.5px;line-height:1.55;margin-bottom:6px;color:#7a3a22}
.tipbox li:last-child{margin-bottom:0}

.jump{display:flex;gap:10px;margin:16px 0 6px}
.jump a{flex:1;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;background:#fff}
.jump a:active{background:var(--surf)}
.jump b{display:block;font-size:15.5px}
.jump span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.jump em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--coral-d);margin-top:9px}

/* ===== map ===== */
.gbar{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.gbar::-webkit-scrollbar{display:none}
.gbar a{flex:0 0 auto;text-decoration:none;background:var(--teal);color:#fff;font:700 12.5px/1 var(--font);padding:11px 14px;border-radius:100px;white-space:nowrap}
.gbar a.alt{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.hint{padding:11px 14px;background:var(--teal-l2);color:var(--teal-d);font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.seg{display:flex;padding:11px 14px}
.seg button{flex:1;appearance:none;cursor:pointer;background:var(--surf);color:var(--ink2);border:1px solid var(--line);font:700 13px/1 var(--font);padding:11px 6px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#map{width:100%;height:calc(100vh - 300px - var(--st));height:calc(100dvh - 300px - var(--st));min-height:360px;background:var(--surf)}
.pin{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font:800 12.5px/1 var(--font);box-shadow:0 2px 8px rgba(18,38,46,.35)}
.pin.x{background:var(--coral)}
.pin.h{background:var(--ink);border-radius:8px}
.leaflet-popup-content-wrapper{border-radius:13px}
.leaflet-popup-content{margin:12px 13px;font:14px/1.45 var(--font)}
.pop b{display:block;font-size:15px;margin-bottom:2px}
.pop i{display:block;font-style:normal;color:var(--ink2);font-size:12px;margin-bottom:9px}
.pop .r{display:flex;gap:6px}
.pop a{flex:1;text-align:center;text-decoration:none;font:700 12.5px/1 var(--font);padding:9px 8px;border-radius:8px}
.pop a.p{background:var(--teal);color:#fff}
.pop a.s{background:var(--coral-l);color:var(--coral-d)}
#plan{display:none;background:var(--surf)}
#plan.on{display:block}
#planSvg{width:100%;height:auto;display:block}
.pfoot{padding:10px 14px 16px;font-size:12px;color:var(--ink2);text-align:center}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:950;background:#fff;border-radius:var(--r);box-shadow:0 10px 40px rgba(18,38,46,.25);border:1px solid var(--line);padding:15px;display:none}
.sheet.on{display:block}
.sheet b{display:block;font-size:16px;margin-bottom:2px}
.sheet i{display:block;font-style:normal;color:var(--ink2);font-size:12.5px;margin-bottom:11px}
.sheet .r{display:flex;gap:7px}
.sheet .r a,.sheet .r button{flex:1;appearance:none;border:0;cursor:pointer;text-align:center;text-decoration:none;font:700 13px/1 var(--font);padding:12px 6px;border-radius:10px}
.sheet .r a.p{background:var(--teal);color:#fff}
.sheet .r a.s{background:var(--coral-l);color:var(--coral-d)}
.sheet .r button{background:var(--surf);color:var(--ink2);border:1px solid var(--line)}

/* ===== stops ===== */
.prog{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:14px 0 6px}
.prog .pt{flex:1}
.prog .pt b{display:block;font-size:15px}
.prog .bar{height:6px;border-radius:100px;background:var(--line2);margin-top:8px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--coral);border-radius:100px;transition:width .25s ease}
.prog button{appearance:none;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font:700 12px/1 var(--font);padding:9px 12px;border-radius:9px;cursor:pointer}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;scroll-margin-top:150px}
.card.flash{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-l)}
.chead{display:flex;gap:11px;padding:15px 14px 12px;align-items:flex-start}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--font)}
.card.extra .num{background:var(--coral)}
.chead .ct{flex:1;min-width:0}
.chead h3{font-size:16.5px}
.chead .alt{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px;line-height:1.45;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 13px}
.meta span{font-size:11px;font-weight:700;background:var(--surf);color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
.meta span.t{background:var(--teal-l);color:var(--teal);border-color:#cfe1e6}
.acts{display:flex;gap:8px;padding:0 14px 13px}
.acts a,.acts button{flex:1;appearance:none;border:0;cursor:pointer;text-align:center;text-decoration:none;font:700 13px/1 var(--font);padding:12px 6px;border-radius:10px}
.acts a{background:var(--teal);color:#fff}
.acts button{background:var(--surf);color:var(--ink2);border:1px solid var(--line)}
.sec{border-top:1px solid var(--line);padding:14px}
.sec h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-d);margin-bottom:9px}
.sec ul{margin:0;padding-left:17px}
.sec li{margin-bottom:7px;font-size:14.5px;line-height:1.55}
.sec li:last-child{margin-bottom:0}
.card details{border-top:1px solid var(--line)}
.card details>summary{padding:14px;display:flex;justify-content:space-between;align-items:center;font:700 13.5px/1 var(--font);color:var(--teal);background:var(--teal-l2)}
.card details>summary::after{content:"+";font-size:19px;font-weight:400;line-height:1}
.card details[open]>summary::after{content:"–"}
.body{padding:6px 15px 20px}
.body p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:#1c333c}
.body p:last-child{margin:0}
.body h4{font-size:15.5px;color:var(--teal);margin:19px 0 8px;text-transform:none;letter-spacing:-.01em}
.body em{color:var(--ink2)}

.card.done{background:var(--surf);border-color:var(--line2)}
.card.done .chead{padding:11px 14px;align-items:center}
.card.done .num{flex:0 0 24px;height:24px;font-size:11.5px;background:var(--teal-l);color:var(--teal)}
.card.done h3{font-size:14.5px;color:var(--ink3);text-decoration:line-through}
.card.done .alt,.card.done .meta,.card.done .acts,.card.done .sec,.card.done details{display:none}

/* ===== sub pages ===== */
.sub{padding:0 14px calc(var(--sb) + 30px);max-width:760px;margin:0 auto}
.dish{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.dish:last-child{border-bottom:0}
.dish .dn{flex:0 0 100px;font-weight:700;font-size:14.5px;color:var(--teal)}
.dish .dd{flex:1;font-size:14px;line-height:1.55;color:var(--ink2)}
.eat{border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:10px}
.eat .et{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.eat h4{font-size:16px}
.eat .pr{font-size:11.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
.eat .ea{font-size:12px;color:var(--coral-d);font-weight:700;margin-top:3px}
.eat p{font-size:14px;line-height:1.6;color:var(--ink2);margin-top:8px}
.eat a{display:inline-block;margin-top:11px;text-decoration:none;background:var(--surf);border:1px solid var(--line);color:var(--teal);font:700 12.5px/1 var(--font);padding:10px 13px;border-radius:9px}
.pc{border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.pc>summary{display:flex;align-items:center;gap:11px;padding:15px;background:var(--teal-l2)}
.pc>summary h3{flex:1;font-size:15.5px;color:var(--teal)}
.pc.warn>summary{background:var(--coral-l)}
.pc.warn>summary h3{color:var(--coral-d)}
.pc .pb{padding:13px 16px 17px;border-top:1px solid var(--line2)}
.pc ul{margin:0;padding-left:17px}
.pc li{margin-bottom:8px;font-size:14.5px;line-height:1.55}
.pc li:last-child{margin-bottom:0}
.pc.warn li{color:#7a3a22}
.backbar{margin:20px 0 4px}

footer{padding:22px 16px calc(var(--sb) + 28px);text-align:center;color:var(--ink3);font-size:12px;line-height:1.6}
footer .fmark{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:9px;text-decoration:none}
footer .fmark .mkbox{display:block;width:24px;height:24px}
footer .fmark b{font:800 14px/1 var(--font);color:var(--teal);letter-spacing:-.02em}
footer .fmark b i{font-style:normal;color:var(--coral)}
#top{position:fixed;right:14px;bottom:calc(var(--sb) + 16px);z-index:800;width:44px;height:44px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:19px;box-shadow:0 4px 14px rgba(18,38,46,.3);display:none;cursor:pointer}

</style>
</head>
<body>

<header>
  <div class="crumb">
    <button id="back">&#8592; Back</button>
    <a href="bukhara.html">Bukhara</a>
    <span class="sp"></span>
    <a href="bukhara-food.html" class="accent">Food</a>
    <a href="index.html">Home</a>
  </div>
  <div class="hb">
    <a class="mkbox" href="index.html" aria-label="RafikTrip home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="16 12 32 42" class="mk"><g fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 50V16h11a9.6 9.6 0 0 1 0 19.2H20"/><path d="M32.6 35.2 44.5 50"/></g><path d="M31.5 19.6a5.1 5.1 0 0 1 5.1 5.1c0 3.6-5.1 8.6-5.1 8.6s-5.1-5-5.1-8.6a5.1 5.1 0 0 1 5.1-5.1z" fill="#FF7A59"/><circle cx="31.5" cy="24.7" r="1.9" fill="#0F4C5C"/></svg></a>
    <div class="tt"><h1>Practical</h1><span class="sub">Bukhara</span></div>
  </div>
</header>

  "more": "<p>This is the oldest surviving Islamic building in Central Asia, and arguably the most important object in Bukhara. It is a cube roughly 10 metres on each side, with a hemispherical dome resting on four corner squinches, and walls nearly two metres thick. Nothing about it is large. Everything about it is perfect.</p>\n<p>It was built for the Samanid dynasty — the Persian-speaking rulers who, in the 9th and 10th centuries, made Bukhara a rival to Baghdad. Ismail Samani (ruled 892–907) is buried here, along with other family members. Under the Samanids this city produced Rudaki, the father of modern Persian poetry, and educated the young Ibn Sina — Avicenna — whose medical encyclopaedia was still being taught in European universities six hundred years later.</p>\n<p><strong>The brickwork is the whole point.</strong> There is no tile, no paint, no gold. The architect used ordinary baked brick laid in more than fifteen different bonds — basketweave, herringbone, chequerboard, rosettes, a dog-tooth cornice — so that the building decorates itself with its own shadows. At dawn it looks like lace. At noon it goes flat and plain. At sunset it turns orange and the patterns come back. It is a building designed to be watched all day.</p>\n<p><strong>Why it survived.</strong> In 1220 Genghis Khan destroyed Bukhara almost completely. The Samanid Mausoleum lived because by then it had been buried — silt from flooding and centuries of a cemetery growing over it had swallowed it up to the roofline. The Mongols rode past a mound. Soviet archaeologists dug it out between 1926 and 1939 and restored it, which is why it now sits in a shallow bowl below the level of the park.</p>\n<p>Look for the pre-Islamic ideas hiding in it: the cube form echoes a Zoroastrian fire temple, and there are four doors, one on each side — a Sogdian habit, not an Arab one. It is the moment Central Asia translated its old architecture into a new religion. Pakistan's national mausoleum for Muhammad   "more": "<p>The name means \"Job's Spring\". The story: the prophet Ayub (Job) passed through this place during a terrible drought, struck the ground with his staff, and a spring of sweet water appeared. The water is still credited with healing properties, and Bukharans still come to draw it.</p>\n<p><strong>The building is a patchwork of four centuries</strong>, and you can read the joins from outside. The oldest core is 12th-century Karakhanid. The main chamber, with an inscription dated 1380, was raised during the reign of Timur (Tamerlane) by master builders he had brought — or deported — from Khorezm, which is why the dome is a tall pointed cone rather than the round Bukharan type. Later Shaybanid rulers, especially Abdullah Khan II, added and repaired. Nobody planned it as one building; it accumulated.</p>\n<p><strong>Why a water museum here is the right idea.</strong> Bukhara is a desert city with no river of its own — it lives off the Zarafshan, brought in by canal. For centuries the city stored its water in more than a hundred open stone pools called <em>hauz</em>. They were beautiful, they were the social centre of every neighbourhood, and they were lethal: the standing water carried the guinea worm, <em>rishta</em>, a parasite that grew a metre long under the skin and had to be wound out on a stick over weeks. Bukhara had one of the worst rates in the world. In the 1920s and 30s the Soviets drained nearly all the pools and piped the water. It is why only a handful of hauz survive today — you will see the most famous one, Lyabi Hauz, at stop 16.</p>",

  "more": "<p>Bolo Hauz means \"above the pool\", and the pool in front of it is one of the very few original <em>hauz</em> the Soviets left. This was the emir's official Friday mosque. He lived in the Ark, two hundred metres away, and would walk out across the Registan to pray here in public — the one weekly moment when the ruler was visible to his subjects.</p>\n<p>The mosque itself dates from 1712, but the part everyone photographs is much younger. The <strong>iwan</strong> — the open portico with twenty slender columns of walnut and elm, twelve metres tall, each capped with a painted stalactite capital (<em>muqarnas</em>) — was added in 1917, in the last years of the emirate. The minaret is from the same moment, built by <strong>Usto Shirin Muradov</strong>, the last of the great Bukharan master builders, who later worked for the Soviets and whose name you will meet again at the emir's summer palace.</p>\n<p>The columns are deliberately thin and set on the edge of the pool so their reflection doubles them. Central Asian architecture has a name for this idea — <em>chil sutun</em>, \"forty columns\", used for any hall where reflection completes the count. It is a piece of theatre, and it works.</p>\n<p>Two hundred metres further west, if you want a short detour, is the <strong>Kosh Madrasa</strong>: the Modari Khan madrasa (1567) and the Abdullah Khan madrasa (1588–90), a pair built facing each other by a son and for his mother. They are semi-ruined, almost always empty, and quietly atmospheric.</p>",

  "more": "<p>The Ark is not a castle inside a city — it is a city inside a wall, and the mound it stands on is entirely artificial, built up over two thousand years from the rubble of each fortress that stood here before. The perimeter is 789.6 metres, the walls 16 to 20 metres high, the enclosure just under four hectares. Archaeological layers go back to the 4th–3rd centuries BC.</p>\n<p><strong>The legend.</strong> Bukharans say the Ark was founded by Siyavush, the tragic prince of the Persian <em>Shahnameh</em>, who built it to win the hand of the local king's daughter. His supposed grave is inside, by the eastern gate, and until modern times cockerels were sacrificed there each spring.</p>\n<p><strong>What it was.</strong> Everything the emirate needed to function: the throne room and the open coronation court, the treasury, the mint, the stables, the prison, the harem quarters, government offices, a Friday mosque for the court, and a library famous across the Islamic world — Avicenna wrote that he found books there he had never seen anywhere else, and that after reading them there was nothing left to learn. When you walk in, the covered ramp between the two 18th-century towers is the original ceremonial approach; the rooms off it were guard posts and, on the left, the drum chamber where the <em>nagora</em> was beaten to mark the hours.</p>\n<p><strong>The Great Game.</strong> In 1842, Emir Nasrullah — nicknamed \"the Butcher\" — held two British officers here: Colonel Charles Stoddart, who had arrived on a diplomatic mission and offended the emir by riding rather than walking into his presence, and Captain Arthur Conolly, the man who coined the phrase \"the Great Game\", who came to rescue him. Both were kept for months in a pit crawling with vermin, then beheaded in the square in front of the Ark. It became one of the most notorious episodes of 19th-century Central Asia and did a great deal to shape the British image of Bukhara.</p>\n<p><strong>The end.</strong> In September 1920 the Red Army under Mikhail Frunze shelled and bombed the Ark from the air. The last emir, Alim Khan, fled to Afghanistan and died in Kabul in 1944. Most of the interior burned — one account says the emir's own people set fires so the Bolsheviks could not desecrate the sacred rooms. What you walk through today is roughly a fifth of what stood in 1919. The wide empty terrace beyond the mosque is the footprint of the vanished palace.</p>\n<p>The museums now inside cover archaeology, natural history, the emirate's administration, and manuscripts and calligraphy in the 18th-century <strong>Juma Mosque</strong>, which has a beautiful carved wooden porch and is the single best-preserved interior on the site.</p>",

  "more": "<p><em>Poi Kalyan</em> means \"at the foot of the great one\" — the great one being the minaret. Three buildings, four hundred years apart, arranged around one square.</p>\n<h4>The Kalyan Minaret (1127)</h4>\n<p>Built by the Karakhanid ruler Arslan Khan, about 46 metres tall, nine metres across at the base, with foundations said to go ten metres down into a bed of reeds laid to absorb earthquakes. Legend says the master builder, Bako, laid the foundation and then disappeared for three years to let it settle before building a single course above it — and that the mortar was mixed with camel's milk and egg yolk. The shaft carries fourteen bands of ornamental brickwork, and no two bands are the same. The inscription band was picked out in glazed blue tile: this is where Bukhara's blue begins, the first use of it in Central Asian architecture.</p>\n<p>It was a lighthouse as much as a minaret. A fire was lit in the sixteen-arched rotunda at the top to guide caravans across the desert at night. There are 105 steps inside.</p>\n<p>Its grimmer nickname is the Tower of Death: from the top, condemned criminals were sewn into sacks and thrown off, a punishment recorded into the 19th century — though guides tend to make it sound more routine than it was.</p>\n<p>In 1220 Genghis Khan levelled Bukhara and burned the mosque beside it, but left the minaret standing. The story Bukharans tell is that he rode up, tilted his head back to see the top, and his hat fell off; bending to pick it up, he decided that a building that had made him bow should not be destroyed. The likelier truth is that it was too useful as a landmark.</p>\n<h4>The Kalyan Mosque (1514)</h4>\n<p>The Friday mosque of the city, rebuilt by the Shaybanid ruler Ubaydullah Khan on the ashes of the one the Mongols burned. It is enormous — 130 by 81 metres, room for roughly twelve thousand worshippers — and it works by a trick: the courtyard is ringed by an arcade of <strong>288 small domes on 208 pillars</strong>, so the mass of the building is pushed to the edges and the empty middle feels vast. The main dome is turquoise on a tall octagonal drum. In the centre of the courtyard is a small octagonal pavilion over a well. During the Soviet period it was closed and used as a warehouse; it returned to worship in 1991.</p>\n<h4>Mir-i-Arab Madrasa (1535–36)</h4>\n<p>Facing the mosque across the square, with two turquoise domes. It is named for Sheikh Abdullah Yamani — \"the Arab prince\" — a Yemeni spiritual adviser to Ubaydullah Khan; both men are buried inside. The construction was reportedly financed by the ransom of three thousand Persian prisoners taken in the khan's Iranian campaigns.</p>\n<p>Its real distinction is that it never stopped. Through seventy years of Soviet atheism, Mir-i-Arab was one of only two functioning madrasas left in the entire USSR. It is still a seminary today, with students in residence, which is why the doors are shut to visitors. Look at the portal, look at the domes, and leave them in peace.</p>",

  "more": "<p>A <em>kosh</em> is a pair of buildings placed face to face across a street, mirroring each other. This is the most famous pair in Bukhara, and the joke of it is the gap in time.</p>\n<h4>Ulugbek Madrasa (1417)</h4>\n<p>The oldest surviving madrasa in Central Asia. It was built by <strong>Ulugh Beg</strong>, Timur's grandson — a ruler who was much more interested in astronomy than in governing, who built the great observatory at Samarkand, measured the length of the year to within a minute, and was eventually murdered on his own son's orders. He built three madrasas: this one, one in Samarkand, one in Gijduvan.</p>\n<p>Carved over the entrance is the line that tells you what he was: <em>\"The pursuit of knowledge is the duty of every Muslim man and woman.\"</em> The decoration is disciplined — geometry, star patterns, restrained tilework, ten-pointed stars referencing his astronomy. It is a scholar's building.</p>\n<h4>Abdulaziz Khan Madrasa (1651–52)</h4>\n<p>Built directly opposite, more than two centuries later, and quite deliberately as an answer. Everything Ulugbek held back, this releases: <em>kundal</em> gilding in relief, painted vaults, Chinese-influenced cloud and lotus motifs picked up along the Silk Road, and — remarkably — figurative creatures, including the <em>simurgh</em>, the mythical bird of Persian legend, and a dragon. Depicting living beings is generally avoided in Islamic architecture; Bukhara's rulers periodically decided the rule did not apply to them.</p>\n<p>It was never finished. Abdulaziz Khan lost his throne, work stopped, and if you look carefully you can see the unresolved sections. There is a small museum of woodcarving inside.</p>",
  "short": "Ulugbek"
 },

  "more": "<p>Bukhara's covered bazaars are not buildings with markets inside them; they are <em>crossroads with domes built over them</em>. In the 16th century, under Abdullah Khan II, the city roofed over its four busiest street junctions so that trade could continue through the summer heat and the winter wind. Three of the original domes survive, plus one covered hall. You will walk through all four today, in the order the trades ran.</p>\n<p><strong>Toqi Zargaron</strong> — \"the dome of the jewellers\" — is the largest, built around 1570, and originally housed some 36 workshops. Look at the structure: a central dome carried on an octagonal drum, surrounded by a ring of smaller cupolas, with the arches arranged so that four streets pass under it without interrupting each other. There is no glass anywhere; the openings do the lighting and the ventilation, and the temperature inside is noticeably lower than in the street.</p>\n<p>The trades were segregated by dome, and the guilds were tightly regulated — weights, purity of metal, and prices were all supervised by the market inspector, the <em>muhtasib</em>. Nine hundred years of the Silk Road passing through, and the shape of the commerce is still legible in the plan of the streets.</p>",

  "more": "<p>\"The dome of the cap sellers\". The junction beneath it takes five streets, not four, which makes the vaulting more complicated than at Zargaron — stand in the middle and trace how the arches step around to close the circle. Sixteenth century, same programme of works as the others.</p>\n<p>Headgear mattered in Bukhara in a way that is hard to overstate. A man's turban told you his profession, his status, his religion, and often his neighbourhood; the length of cloth wound around it was regulated. Non-Muslims — the Jewish community in particular — were required to wear distinguishing dress and a rope belt, and were forbidden the turban. The cap you buy here now, the <em>doppa</em>, is the everyday survivor of all that: a stiff square skullcap, black with white almond-shaped embroidery in the Bukharan and Chust styles, worn folded flat in a pocket.</p>\n<p>The dome also held the book and paper sellers, and the scribes who wrote letters for the illiterate. Bukharan paper, made from mulberry bark in Samarkand and Kokand, was prized across the Islamic world before European paper displaced it.</p>",

  "more": "<p>Magoki Attori means roughly \"the pit of the herbalists\" — <em>attori</em> being the spice and medicine sellers who traded around it. It sits about four and a half metres below the modern street, and it did not sink: the city rose around it. Every generation rebuilt on the rubble of the last, and after a thousand years the ground level had climbed a storey and a half. The mosque was excavated back down to its own floor by Soviet archaeologists in the 1930s.</p>\n<p><strong>What was here before.</strong> This is the oldest continuously sacred spot in Bukhara. Excavation found layers beneath the mosque, and the historical sources describe a pre-Islamic temple on the site, together with a bazaar called <em>Moh</em> — \"moon\" — held here twice a year, where idols were sold. The temple is usually described as Zoroastrian, sometimes as Buddhist; both faiths were present in Sogdian Bukhara, and the evidence does not settle it cleanly. Be a little sceptical of any guide who is certain.</p>\n<p><strong>The south portal</strong> is the treasure: 12th-century Karakhanid work in carved terracotta and cut brick, with early touches of glaze, an intricate field of geometry and stylised script that survived the Mongols because it was already half-buried. Nothing else of that date survives in the city at that quality. The rest of the building was rebuilt in the 16th century.</p>\n<p>You will also hear that Bukhara's Jewish community prayed in this building — at different hours from the Muslim congregation — before they had a synagogue of their own. It is one of the city's favourite stories about itself and it may well be true, though historians handle the specifics carefully. Whether or not the shared-roof detail is exact, the underlying fact is solid: Zoroastrians, Buddhists, Jews and Muslims all worshipped within a few hundred metres of this spot, and often at the same time.</p>",

  "more": "<p>A 16th-century bathhouse that has never stopped working. Below street level again, for the same reason as the mosque next door, and for a practical one too — earth is the cheapest insulation there is, and a hammam is fundamentally a heat-storage problem.</p>\n<p>The plan is the standard Islamic one inherited from Rome: a domed changing hall, then a sequence of progressively hotter chambers heated by a furnace under the floor, with hot air drawn through channels in the stone. The light comes from small glazed eyes punched into the domes, which is why the interior is full of drifting circles of light and steam.</p>\n<p>The bath was a social institution, not just a wash. Business was done here, marriages were arranged, and the <em>tellak</em> — the bath attendant who scrubs and massages you on the hot central slab — was a fixture of city life. The Bukharan treatment still involves a hard scrub with a rough mitt, a massage with ginger oil that will make you gasp, and cold water at the end. It is not gentle and it is not a spa. It is an experience worth having once.</p>",

  "more": "<p><em>Gaukushon</em> comes from the Tajik <em>gov-kushon</em>: \"where the bulls are slaughtered\". This was the cattle market and abattoir quarter, and when the Juybari sheikhs — the powerful Sufi family who effectively ran Bukhara's religious economy in the 16th century — decided to build here, the name stuck to the buildings.</p>\n<p>The ensemble is a madrasa of about 1570, awkwardly and rather beautifully shaped to fit the irregular plot, and the <strong>Khoja Kalon mosque</strong> with its minaret of 1598, roughly forty metres tall — the second highest in Bukhara. The proportions consciously echo the Kalyan minaret without competing with it.</p>\n<p>What makes the detour worth it is not the architecture, which is good but not exceptional, so much as the setting. You have left the polished tourist axis. There are washing lines, children on bicycles, men playing backgammon in the shade, a working neighbourhood mosque. Bukhara's old town is a living residential city of mud-brick courtyard houses, not an open-air museum, and this is where that becomes obvious.</p>",

  "more": "<p>\"The dome of the money-changers\". Sixteenth century, built over the point where the main street crossed the Shahrud, the canal that brought Zarafshan water into the heart of the city. Merchants arriving from India, Persia, Muscovy and China all needed their coin converted, weighed and assayed before they could trade in the bazaars, so the exchange sat at the entrance to the market district — the customs post of the Silk Road, in effect.</p>\n<p>The <em>sarrafs</em> were bankers as much as changers: they issued bills of exchange that let a merchant deposit silver in Bukhara and draw it in Kabul or Kashgar without carrying it across bandit country. A large share of them were Indian and Jewish, and the profession was one of the few open to non-Muslims. It is a small building with a very long reach.</p>\n<p>Look for the stork-shaped scissors on the stalls. They are made in Gijduvan, an hour north, and they are a genuine local craft rather than an import — storks nested on Bukhara's minarets for centuries, though almost none remain today.</p>",

  "more": "<p><em>Lyabi Hauz</em> means \"beside the pool\", and it is the last of Bukhara's great water squares. The pool is 46 by 36 metres and about five metres deep, faced in limestone steps, and shaded by mulberry trees planted — according to the city — in 1477, which would make them among the oldest living things in Bukhara. Of the roughly two hundred <em>hauz</em> that once served the city's neighbourhoods, the Soviets drained nearly all in the anti-<em>rishta</em> campaigns of the 1920s and 30s. This one they kept.</p>\n<p><strong>Three buildings frame it:</strong></p>\n<p><strong>Kukeldash Madrasa</strong> (1568–69), on the north side — the largest madrasa in Bukhara and, when it was built, in Central Asia, with about 160 student cells. <em>Kukeldash</em> means \"foster brother of the khan\", the title of its founder.</p>\n<p><strong>The Khanaka of Nadir Divan-Begi</strong> (1620), on the west — a lodging house for wandering Sufi dervishes, with cells around a domed hall.</p>\n<p><strong>Nadir Divan-Begi Madrasa</strong> (1622), on the east, with the famous portal. It was built as a caravanserai. At the opening ceremony the khan, Imam Quli, publicly congratulated his uncle Nadir on his fine new <em>madrasa</em> — and a khan's word could not be corrected, so a caravanserai it ceased to be. This is why it has no lecture halls and no proper student cells: it was never designed as a school. The mosaic on the portal shows two <em>simurgh</em>, phoenixes, each carrying a white doe in its claws, flying towards a sun with a human face. Living creatures, and a human face, on a religious building — a deliberate and rather magnificent breach of convention.</p>\n<p><strong>The pool's own legend:</strong> Nadir wanted to build here but an elderly Jewish widow owned a house on the plot and refused to sell. Islamic law protected her property as a taxpaying non-Muslim, so he could not simply take it. Instead he diverted a canal so that water undermined her house — and when she came to complain, he offered her a better plot elsewhere in the city, plus the right to build a synagogue on it. That land, the story goes, became the Jewish quarter you will visit at stop 18.</p>\n<p>The bronze figure on the donkey is <strong>Hoja Nasreddin</strong> (1979), the wise fool of Central Asian, Turkish and Persian folklore — a man who wins every argument by losing it. If you tell one story to your family today, tell this one: Nasreddin's neighbour asked to borrow his donkey. \"I'm sorry,\" said Nasreddin, \"the donkey is not here.\" At that moment the donkey brayed loudly from the yard. \"But I hear your donkey!\" said the neighbour. Nasreddin drew himself up: \"Who are you going to believe — a grey-bearded man of honour, or a donkey?\"</p>",

  "more": "<p><em>Chor Minor</em> is Persian for \"four minarets\", and the name is wrong. None of the four towers is a minaret; no call to prayer was ever given from them. Three were used for storage and one contains the staircase.</p>\n<p>What you are looking at is a <strong>gatehouse</strong>. In 1807 a rich Turkmen merchant named Khalif Niyazkul built a madrasa complex here, and this was its ceremonial entrance — the <em>darvazakhana</em>. The madrasa itself, with its courtyard and cells, has almost entirely disappeared. The doorway outlived the building it led into, which is a rather good metaphor and completely accidental.</p>\n<p>Each of the four towers is decorated differently, and one popular reading is that they represent four world religions — Islam, Christianity, Zoroastrianism and Buddhism — all of which had a presence in Bukhara. Another says they represent the four daughters of the founder. Both are folk interpretations rather than documented intent; enjoy them as stories, not facts. What is certain is that the shape is unlike anything else in Central Asia, with more of Delhi or Lahore about it than Samarkand — Niyazkul traded with India.</p>\n<p>The interior chamber has unusually good acoustics and is used as a small mosque. In 1995 one of the four towers collapsed, undermined by rising groundwater — the same problem that quietly threatens much of old Bukhara — and it was rebuilt with UNESCO assistance. Storks nested on the towers within living memory; the last of Bukhara's storks are gone, and the nests you may see on other monuments are replicas.</p>",

 {

  "more": "<p>Bukharan Jews are one of the oldest Jewish communities in the world outside the Middle East. Community tradition traces the presence to the Babylonian exile; documented evidence is firm from the early medieval period onward. They spoke <strong>Bukhori</strong>, a Judeo-Tajik dialect of Persian written in Hebrew characters, and for centuries they were the city's dyers — the indigo and madder trades were almost entirely in Jewish hands — as well as silk merchants, money-changers and musicians.</p>\n<p>Life under the emirate was legally constrained. Jews paid the <em>jizya</em> poll tax, were barred from riding horses inside the city, had to wear a distinctive rope belt and cap rather than a turban, and were restricted in where they could build. Within those limits the community thrived and produced something remarkable: the <em>shashmaqam</em>, the classical six-<em>maqam</em> song cycle of Bukhara and Samarkand, which was largely preserved and performed by Jewish musicians and is now a UNESCO-listed intangible heritage of Uzbekistan and Tajikistan.</p>\n<p>The main synagogue on Sarrafon street dates from around the 16th–17th century and is traditionally linked to the Lyabi Hauz widow's legend you heard at stop 16. It is a modest courtyard building, not a monument — a prayer hall, a Torah ark, worn carpets, a school room.</p>\n<p>The community numbered in the tens of thousands into the 20th century. After the 1970s, and en masse in the 1990s, almost all emigrated to Israel and the United States — the largest Bukharan Jewish population in the world is now in Queens, New York. A few dozen families remain in Bukhara, and the synagogue still holds services. That is what makes the visit worth the twenty minutes: it is not a heritage display, it is the tail end of a two-thousand-year-old story, and it is still going.</p>",

 },

  "more": "<p>This was the family house of one of the richest merchants in the emirate of Bukhara — a courtyard mansion built to the classic plan, with a strict division between the <em>beruni</em>, the outer men's courtyard where business was done and guests received, and the <em>daruni</em>, the inner women's courtyard where the family actually lived. Walking from one to the other tells you more about Bukharan society than any label.</p>\n<p>The interiors are the reason to come: carved and painted ganch plasterwork, alcoves lined with mirrors and niches for porcelain, wooden ceilings painted in the <em>kundal</em> technique with gold relief, a room set up as it would have been for a bride, and displays of the heavy embroidered coats and silver jewellery of the period. Nothing here is grand in the way the Ark is grand. It is domestic, and it is intact.</p>\n<p><strong>The man it is named after had an extraordinary and very short life.</strong> Fayzulla Khodjaev (1896–1938) was the merchant's son, sent to Moscow to be educated. He came back a <em>Jadid</em> — one of the young Muslim reformers who wanted to modernise Bukhara from within, with new-method schools, printing presses and a constitution. The emir was not interested. Khodjaev turned to the Bolsheviks, helped bring the Red Army to Bukhara in 1920, and at twenty-four became the head of the new Bukharan People's Soviet Republic, then chairman of the Council of People's Commissars of Soviet Uzbekistan.</p>\n<p>In 1937 he was arrested. In March 1938 he was tried in Moscow in the last of Stalin's great show trials — the same dock as Bukharin and Rykov — and shot. He was rehabilitated in 1966. His father's house, nationalised by the state his son helped create, is now his memorial.</p>",

  "more": "<p>The country residence of the last emirs of Bukhara, and the strangest building in the region. Emir Alim Khan sent his master craftsmen to St Petersburg to study Russian and European architecture, then brought them home to build this. The result is a genuine hybrid: European facades, columns and glazed verandas on the outside; pure Bukharan ganch, mirror-work and painted ceilings inside.</p>\n<p>The showpiece is the <strong>White Hall</strong> (Oq Zal), executed by Usto Shirin Muradov — the same master who built the columns at Bolo Hauz — in white ganch fretwork backed with mirror, so the whole room glitters. It reportedly took years. There is also a harem building, a pool where the story goes the emir watched his women swim from a balcony, and a garden that once held peacocks (some still do).</p>\n<p>Alim Khan enjoyed it for a very short time. He fled to Afghanistan in 1920 and never came back. The palace became a museum of applied arts, and its collection of suzani and royal robes is the best in the country.</p>\n<p><em>Best combined with:</em> a morning taxi loop, or on the way out of town.</p>",

  "more": "<p>Not a tourist site — a living pilgrimage shrine, and one of the most important in the Islamic world. Baha-ud-Din Naqshband Bukhari (1318–1389) founded the Naqshbandi order, the most widespread Sufi brotherhood on earth, with followers today from Turkey to Indonesia. Bukharans say that three pilgrimages here equal one to Mecca — a claim scholars reject and locals repeat anyway.</p>\n<p>His teaching was famously practical, summed up in a Persian phrase you will see everywhere: <em>\"Dil ba yor-u dast ba kor\"</em> — heart with the Beloved, hands at work. No withdrawal from the world, no visible ecstasy, silent rather than vocal remembrance of God. It is an unusually sober kind of mysticism and it suited a city of merchants.</p>\n<p>The complex has a mosque, a khanaka, the tombs of the emirs of Bukhara, and the saint's grave, which pilgrims circle three times. There is a fallen mulberry trunk which people crawl under for blessing. It is crowded, entirely unselfconscious, and moving in a way none of the museums in town are.</p>\n<p><strong>Dress conservatively — this matters here more than anywhere else in Bukhara.</strong> Women should cover hair, arms and legs. Photograph the architecture, not the people at prayer.</p>",
